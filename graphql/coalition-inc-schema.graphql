  dba: String
  type: BusinessType!
  naicsCode: String
  website: URL
  yearFounded: Int
  incorporationState: String
}

input ApplicationInput {
  policyType: PolicyType!
  business: BusinessInput!
  mailingAddress: AddressInput!
  primaryContact: ContactInput!
  employeeCount: Int!
  annualRevenue: Float!
  currency: String!
  requestedLimit: Float!
  requestedRetention: Float!
  effectiveDate: Date!
  domains: [String!]!
  cloudProviders: [CloudProvider!]!
  priorLosses: Boolean!
}

input EndorsementInput {
  type: String!
  description: String!
  effectiveDate: Date!
}

input ClaimInput {
  policyId: ID!
  claimType: ClaimType!
  incidentDescription: String!
  discoveredAt: DateTime!
  affectedSystems: [String!]!
  contactName: String!
  contactEmail: String!
  contactPhone: String
}

input ClaimUpdateInput {
  status: ClaimStatus
  note: String
  adjusterName: String
  adjusterEmail: String
}

input WebhookInput {
  url: URL!
  description: String
  events: [WebhookEvent!]!
  secret: String
}

input APIKeyInput {
