apis:
- aid: coalition-inc:active-insurance-api
  name: Coalition Active Insurance API
  description: >-
    Partner-gated REST API that brokers and distribution partners use to rate, quote, bind, generate documents
    (quote PDF, Coalition Risk Assessment, signature bundle, specimen policy), and manage renewals for
    Coalition's commercial insurance lines — Cyber, Technology E&O, Executive Risks (D&O, EPL, Fiduciary,
    Crime), Miscellaneous Professional Liability, and AI coverage. Supports webhook events and ships with
    a sandbox environment, dedicated implementation manager, and QA test plans. Coverage spans the United
    States and Canada, with a 99.9% uptime SLA and sub-2-second quote response target. Documentation is
    provisioned to vetted partners; no public OpenAPI is published.
  humanURL: https://www.coalitioninc.com/brokers/api
