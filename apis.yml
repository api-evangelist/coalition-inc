aid: coalition-inc
name: Coalition
description: Coalition is a San Francisco–headquartered cyber insurance and active
  risk management provider founded in 2017 by Joshua Motta (CEO) and John Hering.
  Coalition pairs commercial insurance lines — Cyber, Technology Errors & Omissions,
  Executive Risks (D&O, EPL, Fiduciary, Crime), Miscellaneous Professional Liability,
  and AI coverage — with a continuous attack-surface monitoring and incident-response
  platform (Coalition Control, Wirespeed ADR, Coalition Incident Response, Security
  Awareness Training). The company's underwriting engine is exposed to brokers and
  distribution partners through the Coalition Active Insurance API, a RESTful surface
  that supports rate, quote, bind, document generation, renewals, and webhook events
  across the United States and Canada, with executive risks APIs and additional product
  lines added over time. Coalition also publishes a public Exploit Scoring System
  (ESS) API at ess-api.coalitioninc.com that exposes CVE detail, ESS/EPSS/CVSS scoring,
  exploit references (ExploitDB, Metasploit), GitHub repository signals, and Twitter
  mention timelines for over 200,000 vulnerabilities. Coalition is backed by Allianz
  X, Valor Equity Partners, Ribbit Capital, Mitsui Sumitomo, Kinetic Partners and
  other strategic insurers (Allianz, Arch, Ascot, Zurich, Swiss Re, Lloyd's syndicates);
  it raised a $250M Series F in 2022 at a $5B valuation. The Active Insurance API
  is partner-gated (no public OpenAPI), but the ESS API is fully public with OpenAPI
  3.1, an interactive docs UI, and ReDoc.
