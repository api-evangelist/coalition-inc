  effectiveDateTo: Date
}

input QuoteFilter {
  policyType: PolicyType
  status: QuoteStatus
  applicationId: ID
  issuedFrom: Date
  issuedTo: Date
}

input ApplicationFilter {
  policyType: PolicyType
  status: String
  submittedFrom: Date
  submittedTo: Date
}

input ClaimFilter {
  claimType: ClaimType
  status: ClaimStatus
  policyId: ID
  filedFrom: Date
  filedTo: Date
}

input CVEFilter {
  essMinScore: Float
  essMaxScore: Float
  severity: ESSSeverity
  publishedFrom: Date
  publishedTo: Date
  hasExploits: Boolean
}

# ─── Root Operations ───────────────────────────────────────────────────────────

type Query {
  """Retrieve a single policy by ID."""
  policy(id: ID!): Policy

  """List policies with optional filtering and pagination."""
  policies(filter: PolicyFilter, first: Int, after: String): PolicyConnection!

  """Retrieve a single quote by ID."""
  quote(id: ID!): Quote

  """List quotes with optional filtering and pagination."""
  quotes(filter: QuoteFilter, first: Int, after: String): QuoteConnection!

  """Retrieve a single application by ID."""
  application(id: ID!): Application

  """List applications with optional filtering and pagination."""
  applications(filter: ApplicationFilter, first: Int, after: String): ApplicationConnection!

  """Retrieve a single claim by ID."""
  claim(id: ID!): Claim

  """List claims with optional filtering and pagination."""
  claims(filter: ClaimFilter, first: Int, after: String): ClaimConnection!

  """Retrieve CVE details with ESS scoring."""
  cve(cveId: String!): CVE

  """List CVEs with scoring and filtering."""
  cves(filter: CVEFilter, first: Int, after: String): CVEConnection!

  """Retrieve insurer details."""
  insurer(id: ID!): Insurer

  """List all supported insurers."""
  insurers: [Insurer!]!

  """Retrieve a webhook configuration."""
  webhook(id: ID!): Webhook

  """List all registered webhook configurations."""
  webhooks: [Webhook!]!

  """Retrieve the current authenticated partner's API keys."""
  apiKeys: [APIKey!]!

  """Retrieve risk assessment for an application."""
  assessment(applicationId: ID!): Assessment

  """Retrieve a vulnerability scan for an insured."""
  vulnerabilityScan(insuredId: ID!): VulnerabilityScan

  """Retrieve a certificate of insurance."""
  certificate(id: ID!): Certificate

  """List certificates for a policy."""
  certificates(policyId: ID!): [Certificate!]!
}

type Mutation {
  """Start a new insurance application."""
  createApplication(input: ApplicationInput!): Application!

  """Submit an application for underwriting."""
  submitApplication(id: ID!): Application!

  """Generate a quote from a submitted application."""
  createQuote(applicationId: ID!): Quote!

  """Bind a quoted policy."""
  bindPolicy(input: BindRequest!): BindDetails!

  """Update policy metadata."""
  updatePolicy(id: ID!, input: PolicyInput!): Policy!

  """Cancel an active policy."""
  cancelPolicy(id: ID!, reason: String!): Policy!

  """Add an endorsement to a policy."""
  createEndorsement(policyId: ID!, input: EndorsementInput!): Endorsement!

  """Initiate a renewal for an expiring policy."""
  initiateRenewal(policyId: ID!): Renewal!

  """File a new claim against a policy."""
  fileClaim(input: ClaimInput!): Claim!

  """Update an existing claim."""
  updateClaim(id: ID!, input: ClaimUpdateInput!): Claim!

  """Issue a certificate of insurance for a policy."""
  issueCertificate(policyId: ID!, holderName: String!, holderAddress: AddressInput!): Certificate!

  """Register a new webhook endpoint."""
  createWebhook(input: WebhookInput!): Webhook!

  """Delete a webhook registration."""
  deleteWebhook(id: ID!): Boolean!

  """Generate a new API key."""
  generateAPIKey(input: APIKeyInput!): APIKey!

  """Revoke an API key."""
  revokeAPIKey(id: ID!): Boolean!

  """Generate a bearer token from an API key."""
  generateToken(apiKeyId: ID!): Token!
}

type Subscription {
  """Subscribe to policy status changes."""
  policyStatusChanged(policyId: ID!): Policy!

  """Subscribe to quote events for an application."""
  quoteIssued(applicationId: ID!): Quote!

  """Subscribe to claim status updates."""
  claimStatusChanged(claimId: ID!): Claim!

  """Subscribe to renewal lifecycle events."""
  renewalUpdated(policyId: ID!): Renewal!

  """Subscribe to ESS score changes for a CVE."""
  essScoreChanged(cveId: String!): CVE!
}
